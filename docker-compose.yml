services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/skillbridge
      JWT_SECRET: local-docker-only-change-this-secret-before-deploying
      CLIENT_URL: http://localhost:8080
      ADMIN_EMAIL: admin@skillbridge.local
      ADMIN_PASSWORD: local-docker-admin-change-this
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_DEMO_MODE: "false"
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  mongo_data:
